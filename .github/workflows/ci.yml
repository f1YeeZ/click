name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Clean test and package
        working-directory: backend
        run: mvn --batch-mode clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements-e2e.txt
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps --no-shell chromium
      - name: Browser smoke tests
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/clicker-vite.log 2>&1 &
          npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t clicker-backend:test backend
      - name: Build frontend image
        run: docker build -t clicker-frontend:test frontend
