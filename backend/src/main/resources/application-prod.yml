server:
  # Forwarding headers are resolved only when the immediate peer is a configured trusted proxy.
  forward-headers-strategy: none
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never

app:
  security:
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:172.16.0.0/12,127.0.0.1/32,::1/128}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:clicker-index}
    audience: ${JWT_AUDIENCE:clicker-index-web}
  auth:
    access-expires-minutes: ${ACCESS_TOKEN_EXPIRES_MINUTES:10}
    refresh-expires-days: ${REFRESH_TOKEN_EXPIRES_DAYS:30}
    secure-cookies: ${SECURE_AUTH_COOKIES:true}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${QQ_MAIL_FROM}
  images:
    storage-path: ${IMAGE_STORAGE_PATH:/data/mouse-images}
  seed:
    enabled: false

logging:
  level:
    root: INFO
    com.clicker.mousehub: INFO
