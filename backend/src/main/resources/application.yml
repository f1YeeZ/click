server:
  port: ${BACKEND_PORT:8080}
  tomcat:
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:1000}
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    mbeanregistry:
      enabled: true
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: clicker-index-api
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/click}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
      encoding: UTF-8
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_AUTH_CODE:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=256,expireAfterWrite=30s

mybatis-plus:
  type-handlers-package: com.clicker.mousehub.common
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  security:
    trusted-proxies: ${TRUSTED_PROXY_CIDRS:}
    rate-limit-dialect: ${RATE_LIMIT_DIALECT:postgres}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:clicker-index-development-secret-change-before-production-2026}
    issuer: ${JWT_ISSUER:clicker-index}
    audience: ${JWT_AUDIENCE:clicker-index-web}
  auth:
    access-expires-minutes: ${ACCESS_TOKEN_EXPIRES_MINUTES:10}
    refresh-expires-days: ${REFRESH_TOKEN_EXPIRES_DAYS:30}
    secure-cookies: ${SECURE_AUTH_COOKIES:false}
  realtime:
    max-connections: ${SSE_MAX_CONNECTIONS:5000}
    max-connections-per-address: ${SSE_MAX_CONNECTIONS_PER_ADDRESS:50}
    emitter-timeout-ms: ${SSE_EMITTER_TIMEOUT_MS:0}
    heartbeat-ms: ${SSE_HEARTBEAT_MS:25000}
    heartbeat-tick-ms: ${SSE_HEARTBEAT_TICK_MS:1000}
    event-coalesce-ms: ${SSE_EVENT_COALESCE_MS:100}
    fanout-threads: ${SSE_FANOUT_THREADS:8}
    fanout-queue-capacity: ${SSE_FANOUT_QUEUE_CAPACITY:512}
    fanout-chunk-size: ${SSE_FANOUT_CHUNK_SIZE:128}
  analytics:
    hash-salt: ${ANALYTICS_HASH_SALT:${JWT_SECRET:clicker-index-development-secret-change-before-production-2026}}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${QQ_MAIL_FROM:${QQ_MAIL_USERNAME:}}
  verification:
    expires-seconds: ${VERIFICATION_CODE_EXPIRES_SECONDS:60}
    resend-seconds: ${VERIFICATION_CODE_RESEND_SECONDS:60}
  images:
    storage-path: ${IMAGE_STORAGE_PATH:data/mouse-images}
    max-size-bytes: ${IMAGE_MAX_SIZE_BYTES:5242880}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-email: ${APP_SEED_ADMIN_EMAIL:}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}

management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
