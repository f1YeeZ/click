server:
  port: ${BACKEND_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: clicker-index-api
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/click}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
      encoding: UTF-8
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_AUTH_CODE:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=256,expireAfterWrite=30s

mybatis-plus:
  type-handlers-package: com.clicker.mousehub.common
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:clicker-index-development-secret-change-before-production-2026}
    expires-hours: ${JWT_EXPIRES_HOURS:24}
    issuer: ${JWT_ISSUER:clicker-index}
    audience: ${JWT_AUDIENCE:clicker-index-web}
  realtime:
    max-connections: ${SSE_MAX_CONNECTIONS:200}
    max-connections-per-address: ${SSE_MAX_CONNECTIONS_PER_ADDRESS:5}
    heartbeat-ms: ${SSE_HEARTBEAT_MS:20000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${QQ_MAIL_FROM:${QQ_MAIL_USERNAME:}}
  verification:
    expires-minutes: ${VERIFICATION_CODE_EXPIRES_MINUTES:10}
    resend-seconds: ${VERIFICATION_CODE_RESEND_SECONDS:60}
  images:
    storage-path: ${IMAGE_STORAGE_PATH:data/mouse-images}
    max-size-bytes: ${IMAGE_MAX_SIZE_BYTES:5242880}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin-email: ${APP_SEED_ADMIN_EMAIL:}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}

management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
