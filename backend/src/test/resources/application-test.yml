spring:
  datasource:
    url: jdbc:h2:mem:clicker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never

management:
  health:
    mail:
      enabled: false

app:
  security:
    rate-limit-dialect: h2
  seed:
    enabled: false
  mail:
    enabled: false
