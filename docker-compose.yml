services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clicker}
      POSTGRES_USER: ${POSTGRES_USER:-clicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [clicker_internal]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-clicker}
      DB_USERNAME: ${POSTGRES_USER:-clicker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?请在 .env 中配置 PUBLIC_ORIGIN}
      MAIL_ENABLED: "true"
      QQ_MAIL_USERNAME: ${QQ_MAIL_USERNAME:?请配置邮件账号}
      QQ_MAIL_AUTH_CODE: ${QQ_MAIL_AUTH_CODE:?请配置邮件授权码}
      QQ_MAIL_FROM: ${QQ_MAIL_FROM:?请配置发件地址}
      IMAGE_STORAGE_PATH: /data/mouse-images
      APP_SEED_ENABLED: "false"
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL:-}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-}
    volumes:
      - mouse_images:/data/mouse-images
    depends_on:
      database:
        condition: service_healthy
    networks: [clicker_internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_OPERATOR_NAME: ${OPERATOR_NAME:?请在 .env 中配置 OPERATOR_NAME}
        VITE_LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:?请在 .env 中配置 LEGAL_CONTACT_EMAIL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [clicker_internal]

volumes:
  postgres_data:
  mouse_images:

networks:
  clicker_internal:
    driver: bridge
